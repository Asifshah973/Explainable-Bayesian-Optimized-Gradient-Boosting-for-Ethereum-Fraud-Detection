[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otlgbm"
version = "1.0.0"
description = "Optuna-tuned LightGBM (OT-LGBM) for blockchain (Ethereum) fraud detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.2",
    "imbalanced-learn",
    "lightgbm",
    "xgboost",
    "optuna",
    "shap",
    "matplotlib",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
otlgbm = "otlgbm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
